## Complemento de observabilidade.
##
## Sobe Elasticsearch, Logstash e Kibana, e aponta os tres servicos para o
## Logstash. Sem este arquivo, o ambiente base continua leve:
##
##   docker compose up -d
##
## Com observabilidade:
##
##   docker compose -f docker-compose.yml -f docker-compose.observabilidade.yml up -d

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: split-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-dados:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: split-logstash
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./observabilidade/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: split-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  split-service:
    environment:
      LOGSTASH_HOST: logstash

  spi-envio-service:
    environment:
      LOGSTASH_HOST: logstash

  spi-simulator:
    environment:
      LOGSTASH_HOST: logstash

volumes:
  # Sem volume, reiniciar o container apaga os logs indexados.
  elasticsearch-dados:
